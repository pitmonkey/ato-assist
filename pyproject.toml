[project]
name = "ato-assist"
version = "0.1.0"
description = "ATO assessment workbench — file contract, validator, and status derivation."
requires-python = ">=3.11"
# Deliberately empty. The plugin runs against system python3 with no venv;
# see the "Python runtime" section of CLAUDE.md.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "PyYAML>=6.0",       # test-only differential oracle for miniyaml
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ato_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The bare try/except/pass envelope is the point in a hook: an explicit, greppable
# "never disrupt the session" is clearer here than contextlib.suppress.
"hooks/*.py" = ["SIM105"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
